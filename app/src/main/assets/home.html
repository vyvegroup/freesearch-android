<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#F5F5F5;color:#1A1A1A}
.logo{font-size:42px;font-weight:800;color:#6200EE;margin-bottom:8px;letter-spacing:-1px}
.tagline{font-size:14px;color:#757575;margin-bottom:36px;text-align:center;padding:0 20px}
.box{background:#fff;border-radius:24px;padding:28px 24px;width:90%;max-width:400px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.box p{font-size:12px;color:#9E9E9E;text-align:center;margin-top:12px}
.engine{display:flex;align-items:center;gap:10px;background:#EEEEEE;border-radius:12px;padding:10px 14px;margin-bottom:14px}
.engine svg{flex-shrink:0}
.engine span{font-size:13px;color:#555}
.tips{font-size:11px;color:#BDBDBD;text-align:center;margin-top:24px;padding:0 20px}
.tips b{color:#9E9E9E}
</style>
</head>
<body>
<div class="logo">FreeSearch</div>
<div class="tagline">Search freely. No filters. No limits.</div>
<div class="box">
    <div class="engine">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#6200EE" stroke-width="2"/><path d="M16 16l4 4" stroke="#6200EE" stroke-width="2" stroke-linecap="round"/></svg>
        <span>DuckDuckGo (default, no filter)</span>
    </div>
    <div class="engine">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#FF6D00" stroke-width="2"/><path d="M12 8v4l3 3" stroke="#FF6D00" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Type in the search bar above to begin</span>
    </div>
    <p>Use the top search bar to search anything</p>
</div>
<div class="tips">
    <b>Tip:</b> Press Home button to return here<br>
    Built with love - FreeSearch v1.0.0
</div>
</body>
</html>
